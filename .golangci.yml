version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec # security linter; replaces a separate gosec step
    - misspell
    - noctx
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        # Write errors to a terminal or an HTTP client cannot be handled
        # usefully; callers that care write through a checked path.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

issues:
  # Report every finding, not only the first few of each kind.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
