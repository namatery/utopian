name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# TODO(release): pin every action to a full commit SHA before v1.0 (threat T9).
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # no go.sum until the first dependency
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # no go.sum until the first dependency
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # no go.sum until the first dependency
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false # no go.sum until the first dependency
      - run: make fuzz FUZZTIME=60s
